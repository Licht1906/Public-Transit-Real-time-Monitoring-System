apiVersion: v1
kind: ServiceAccount
metadata:
  name: transit-spark
  namespace: spark-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: transit-spark-edit
  namespace: spark-operator
subjects:
  - kind: ServiceAccount
    name: transit-spark
    namespace: spark-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: transit-batch
  namespace: spark-operator
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: "apache/spark:3.5.0"
    imagePullPolicy: IfNotPresent
    mainApplicationFile: "s3a://sg-transit-data/jobs/batch_job.py"
    sparkVersion: "3.5.0"
    restartPolicy:
      type: OnFailure
      onFailureRetries: 2
      onFailureRetryInterval: 30
    deps:
      packages:
        - "org.mongodb.spark:mongo-spark-connector_2.12:10.2.0"
        - "org.apache.hadoop:hadoop-aws:3.3.4"
        - "com.amazonaws:aws-java-sdk-bundle:1.12.262"
        - "graphframes:graphframes:0.8.3-spark3.5-s_2.12"
    sparkConf:
      "spark.jars.ivy": "/tmp/.ivy2"
      "spark.hadoop.fs.s3a.endpoint": "http://minio.data.svc.cluster.local:9000"
      "spark.hadoop.fs.s3a.access.key": "minioadmin"
      "spark.hadoop.fs.s3a.secret.key": "minioadmin123"
      "spark.hadoop.fs.s3a.path.style.access": "true"
      "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
      "spark.sql.shuffle.partitions": "8"
    driver:
      cores: 1
      memory: "2g"
      serviceAccount: transit-spark
      env:
        - name: HOME
          value: "/tmp"
        - name: STORAGE_MODE
          value: "minio"
        - name: ENABLE_ML
          value: "true"
        - name: ENABLE_GRAPH
          value: "true"
        - name: DAYS_BACK
          value: "30"
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: transit-config
              key: MINIO_ENDPOINT
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: transit-config
              key: MINIO_BUCKET
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MONGODB_URI
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_SECRET_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_SECRET_KEY
    executor:
      cores: 1
      instances: 2
      memory: "2g"
      env:
        - name: HOME
          value: "/tmp"
        - name: STORAGE_MODE
          value: "minio"
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: transit-config
              key: MINIO_ENDPOINT
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: transit-config
              key: MINIO_BUCKET
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MONGODB_URI
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_SECRET_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: transit-secrets
              key: MINIO_SECRET_KEY
