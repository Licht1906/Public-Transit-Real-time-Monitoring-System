apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: transit-batch-once
  namespace: spark-operator
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "gcr.io/spark-operator/spark-py:v3.5.0"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "s3a://sg-transit-data/jobs/batch_job.py"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 30
  deps:
    packages:
      - "org.mongodb.spark:mongo-spark-connector_2.12:10.6.1"
      - "org.apache.hadoop:hadoop-aws:3.3.4"
      - "com.amazonaws:aws-java-sdk-bundle:1.12.262"
      - "graphframes:graphframes:0.8.3-spark3.5-s_2.12"
  sparkConf:
    "spark.jars.ivy": "/tmp/.ivy"
    "spark.mongodb.read.connection.uri": "mongodb://root:Transit%402024@mongodb.data.svc.cluster.local:27017/transit_db?authSource=admin"
    "spark.mongodb.write.connection.uri": "mongodb://root:Transit%402024@mongodb.data.svc.cluster.local:27017/transit_db?authSource=admin"
    "spark.sql.shuffle.partitions": "8"
  driver:
    cores: 1
    memory: "2g"
    serviceAccount: transit-spark
    env:
      - name: HOME
        value: "/tmp"
      - name: STORAGE_MODE
        value: "minio"
      - name: ENABLE_ML
        value: "true"
      - name: ENABLE_GRAPH
        value: "true"
      - name: DAYS_BACK
        value: "30"
      - name: MINIO_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: transit-config
            key: MINIO_ENDPOINT
      - name: MINIO_BUCKET
        valueFrom:
          configMapKeyRef:
            name: transit-config
            key: MINIO_BUCKET
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: transit-secrets
            key: MONGODB_URI
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: transit-secrets
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: transit-secrets
            key: MINIO_SECRET_KEY
  executor:
    cores: 1
    instances: 2
    memory: "2g"
    env:
      - name: HOME
        value: "/tmp"
      - name: STORAGE_MODE
        value: "minio"
      - name: MINIO_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: transit-config
            key: MINIO_ENDPOINT
      - name: MINIO_BUCKET
        valueFrom:
          configMapKeyRef:
            name: transit-config
            key: MINIO_BUCKET
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: transit-secrets
            key: MONGODB_URI
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: transit-secrets
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: transit-secrets
            key: MINIO_SECRET_KEY
