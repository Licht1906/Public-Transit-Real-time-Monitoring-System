<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SG Transit Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--ink:#17202a;--muted:#627083;--line:#d8dee7;--bg:#f4f7fb;--blue:#2264d1;--green:#16875f;--amber:#b56a00;--red:#c93636;--violet:#6750a4}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
    h1{font-size:18px;margin:0}.status{color:var(--muted);font-size:13px;white-space:nowrap}
    nav{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;background:#eef3f8;border-bottom:1px solid var(--line)}
    .tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:6px;font-weight:650;cursor:pointer;min-width:max-content}.tab.active{border-color:var(--blue);color:var(--blue)}
    main{height:calc(100vh - 106px)}.view{display:none;height:100%}.view.active{display:grid;grid-template-columns:minmax(0,1fr) 390px}.map{min-height:100%;width:100%}
    aside{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:16px}.controls{display:grid;gap:10px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center}
    input,select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;background:#fff}
    button{min-height:38px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap}button.secondary{background:#fff;color:var(--blue)}
    .metric,.item-card,.state-box,.error-box,.alert-box{border:1px solid var(--line);border-radius:6px;background:#fff}.metric{display:grid;gap:4px;padding:12px;margin-bottom:12px;background:#fbfcfe}.metric strong{font-size:26px}
    .result-meta{color:var(--muted);font-size:13px;margin:8px 0 10px}.item-card{padding:11px;margin-bottom:9px}.card-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.card-title{font-weight:720;overflow-wrap:anywhere}.card-meta{color:var(--muted);font-size:12px;margin-top:5px}
    .badge{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:760;white-space:nowrap;background:#edf1f7;color:#344054}.badge-free,.badge-low{background:#e8f6ef;color:var(--green)}.badge-medium{background:#fff3d6;color:var(--amber)}.badge-busy,.badge-high,.badge-full{background:#fde8e8;color:var(--red)}
    .state-box,.error-box,.alert-box{padding:12px;color:var(--muted);background:#fbfcfe}.error-box{border-color:#f0b7b7;color:var(--red)}.alert-box{border-color:#f0d08a;color:var(--amber);margin-bottom:10px}
    @media(max-width:900px){header{align-items:flex-start;flex-direction:column}main{height:auto}.view.active{grid-template-columns:1fr}.map{height:56vh;min-height:420px}aside{border-left:0;border-top:1px solid var(--line)}}
  </style>
</head>
<body>
  <header><h1>Singapore Multi-Modal Transit Monitor</h1><div id="health" class="status">Checking API...</div></header>
  <nav>
    <button class="tab active" data-tab="bus">Bus</button><button class="tab" data-tab="mrt">MRT</button><button class="tab" data-tab="carpark">Carpark</button><button class="tab" data-tab="ev">EV Charging</button><button class="tab" data-tab="taxi">Taxi</button>
  </nav>
  <main>
    <section id="bus" class="view active"><div id="bus-map" class="map"></div><aside><div class="controls"><div class="row"><input id="bus-search" placeholder="Search stop code or name" /><button onclick="searchStops()">Search</button></div><button class="secondary" onclick="loadBusStops()">Reload stops</button></div><div id="bus-result" class="state-box">Loading bus stops...</div></aside></section>
    <section id="mrt" class="view"><div id="mrt-map" class="map"></div><aside><div class="controls"><select id="mrt-line" onchange="loadMRT()"><option value="NSL">North South Line</option><option value="EWL">East West Line</option><option value="NEL">North East Line</option><option value="CCL">Circle Line</option><option value="DTL">Downtown Line</option><option value="TEL">Thomson-East Coast Line</option><option value="BPL">Bukit Panjang LRT</option></select></div><div id="mrt-alert"></div><div id="mrt-result" class="state-box">Choose a line to load crowd data.</div></aside></section>
    <section id="carpark" class="view"><div id="cp-map" class="map"></div><aside><div class="controls"><select id="cp-agency"><option value="">All agencies</option><option value="HDB">HDB</option><option value="LTA">LTA</option><option value="URA">URA</option></select><input id="cp-min-lots" type="number" min="0" value="20" /><button onclick="loadCarpark()">Apply filter</button></div><div id="cp-result" class="state-box">Loading carparks...</div></aside></section>
    <section id="ev" class="view"><div id="ev-map" class="map"></div><aside><div class="controls"><div class="row"><input id="ev-lat" value="1.3521" /><input id="ev-lng" value="103.8198" /></div><input id="ev-radius" type="number" min="1" max="50" value="5" /><div class="row"><button onclick="loadEV()">Find stations</button><button class="secondary" onclick="useMyLocation()">Use location</button></div></div><div id="ev-result" class="state-box">Enter a location to find nearby chargers.</div></aside></section>
    <section id="taxi" class="view"><div id="taxi-map" class="map"></div><aside><div class="metric"><span class="result-meta">Available taxis in latest window</span><strong id="taxi-count">0</strong><span id="taxi-update" class="card-meta">Waiting for data</span></div><button onclick="loadTaxi()">Refresh taxi density</button></aside></section>
  </main>
  <script>
    const SG_CENTER=[1.3521,103.8198],lineColors={NS:"#d42e12",EW:"#009645",NE:"#9900aa",CC:"#fa9e0d",DT:"#005ec4",TE:"#9d5b25",BP:"#718472"},lineNames={NSL:"North South Line",EWL:"East West Line",NEL:"North East Line",CCL:"Circle Line",DTL:"Downtown Line",TEL:"Thomson-East Coast Line",BPL:"Bukit Panjang LRT"};
    let maps={},busStops=[],busLayer=null,mrtGeoJSON=null,mrtLayers=[],cpMarkers=[],evMarkers=[],taxiMarkers=[];
    const health=document.getElementById("health"),busResult=document.getElementById("bus-result"),busSearch=document.getElementById("bus-search"),mrtLine=document.getElementById("mrt-line"),mrtResult=document.getElementById("mrt-result"),mrtAlert=document.getElementById("mrt-alert"),cpAgency=document.getElementById("cp-agency"),cpMinLots=document.getElementById("cp-min-lots"),cpResult=document.getElementById("cp-result"),evLat=document.getElementById("ev-lat"),evLng=document.getElementById("ev-lng"),evRadius=document.getElementById("ev-radius"),evResult=document.getElementById("ev-result"),taxiCount=document.getElementById("taxi-count"),taxiUpdate=document.getElementById("taxi-update");
    function baseMap(id){const m=L.map(id).setView(SG_CENTER,12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(m);return m}
    function initMap(name,id){if(!maps[name])maps[name]=baseMap(id);setTimeout(()=>maps[name].invalidateSize(),80);return maps[name]}
    async function apiJson(url){const r=await fetch(url),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.statusText);return d}
    async function checkHealth(){try{const h=await apiJson("/health");health.textContent=`API ${h.api} | Mongo ${h.mongodb} | Redis ${h.redis}`}catch(e){health.textContent="API unavailable"}}
    function markerIcon(color,size=12){return L.divIcon({className:"",html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`,iconAnchor:[size/2,size/2]})}
    function renderCards(target,meta,rows){document.getElementById(target).innerHTML=`<div class="result-meta">${meta}</div>`+rows.join("")}
    function activateTab(tab){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===tab));if(tab==="bus")initBus();if(tab==="mrt")initMRT();if(tab==="carpark")initCarpark();if(tab==="ev")initEV();if(tab==="taxi")initTaxi()}
    function initBus(){const m=initMap("bus","bus-map");if(!busLayer)loadBusStops();return m}
    async function loadBusStops(){busResult.className="state-box";busResult.textContent="Loading bus stops...";try{const d=await apiJson("/bus/stops");busStops=d.stops||[];drawBusStops(busStops);busResult.innerHTML=`<div class="result-meta">${d.count} stops loaded from ${d.source}</div>`}catch(e){busResult.className="error-box";busResult.textContent=e.message}}
    function drawBusStops(stops){const m=initBus();if(busLayer)m.removeLayer(busLayer);busLayer=L.layerGroup();stops.forEach(s=>{if(!s.Latitude||!s.Longitude)return;L.marker([s.Latitude,s.Longitude],{icon:markerIcon("#2264d1",11)}).bindPopup(`<b>${s.Description||"Bus stop"}</b><br>${s.BusStopCode}<br>${s.RoadName||""}<br><button onclick="loadArrivals('${s.BusStopCode}')">Load arrivals</button>`).addTo(busLayer)});busLayer.addTo(m)}
    function searchStops(){const q=busSearch.value.trim().toLowerCase();if(!q)return drawBusStops(busStops);const matches=busStops.filter(s=>String(s.BusStopCode||"").includes(q)||String(s.Description||"").toLowerCase().includes(q)||String(s.RoadName||"").toLowerCase().includes(q)).slice(0,300);drawBusStops(matches);renderCards("bus-result",`${matches.length} matching stops`,matches.slice(0,20).map(s=>`<div class="item-card"><div class="card-row"><span class="card-title">${s.Description||s.BusStopCode}</span><button onclick="focusStop('${s.BusStopCode}')">Open</button></div><div class="card-meta">${s.BusStopCode} | ${s.RoadName||""}</div></div>`))}
    function focusStop(code){const s=busStops.find(x=>x.BusStopCode===code);if(!s)return;maps.bus.setView([s.Latitude,s.Longitude],17);loadArrivals(code)}
    async function loadArrivals(code){busResult.className="state-box";busResult.textContent=`Loading arrivals for ${code}...`;try{const d=await apiJson(`/bus/arrivals/${code}`);renderCards("bus-result",`${d.services_count} services | source: ${d.source}`,d.data.map(s=>`<div class="item-card"><div class="card-row"><span class="card-title">Bus ${s.service_no}</span><span class="badge">${s.operator}</span></div><div class="card-meta">${s.buses.map(b=>`${b.eta_minutes??"?"} min (${b.load})`).join(" | ")}</div></div>`))}catch(e){busResult.className="error-box";busResult.textContent=e.message}}
    async function initMRT(){initMap("mrt","mrt-map");if(!mrtGeoJSON)mrtGeoJSON=await apiJson("/static/mrt_lines.geojson");loadMRT()}
    async function loadMRT(){const line=mrtLine.value,m=initMap("mrt","mrt-map");mrtResult.className="state-box";mrtResult.textContent="Loading MRT data...";try{const [crowd,alerts]=await Promise.all([apiJson(`/mrt/crowd/${line}`),apiJson("/mrt/alerts")]);mrtLayers.forEach(l=>m.removeLayer(l));mrtLayers=[];const prefix=line.slice(0,2),color=lineColors[prefix]||"#344054",crowdMap=Object.fromEntries((crowd.stations||[]).map(s=>[s.station,s]));const lineLayer=L.geoJSON(mrtGeoJSON,{filter:f=>f.geometry.type.includes("LineString")&&f.properties.name===lineNames[line],style:{color,weight:5,opacity:.9}}).addTo(m);const pointLayer=L.geoJSON(mrtGeoJSON,{filter:f=>f.geometry.type==="Point"&&String(f.properties.station_codes||"").split("-").some(c=>c.startsWith(prefix)),pointToLayer:(f,ll)=>{const station=String(f.properties.station_codes||"").split("-").map(c=>crowdMap[c]).find(Boolean),status=station?.crowd_text||"UNKNOWN",c=status==="HIGH"?"#c93636":status==="MEDIUM"?"#b56a00":"#16875f";return L.marker(ll,{icon:markerIcon(c,13)}).bindPopup(`<b>${f.properties.name}</b><br>${f.properties.station_codes}<br>${status}`)}}).addTo(m);mrtLayers.push(lineLayer,pointLayer);if(lineLayer.getBounds().isValid())m.fitBounds(lineLayer.getBounds(),{padding:[20,20]});else if(pointLayer.getBounds().isValid())m.fitBounds(pointLayer.getBounds(),{padding:[20,20]});mrtAlert.innerHTML=alerts.count>0?`<div class="alert-box">${alerts.count} active train alerts</div>`:"";renderCards("mrt-result",`${crowd.stations.length} stations | ${crowd.high_count} high crowd`,crowd.stations.map(s=>{const cls=s.crowd_text==="HIGH"?"high":s.crowd_text==="MEDIUM"?"medium":"low";return `<div class="item-card"><div class="card-row"><span class="card-title">${s.station}</span><span class="badge badge-${cls}">${s.crowd_text}</span></div><div class="card-meta">${s.alert_level} | ${s.updated_at||""}</div></div>`}))}catch(e){mrtResult.className="error-box";mrtResult.textContent=e.message}}
    function initCarpark(){initMap("carpark","cp-map");loadCarpark()}
    async function loadCarpark(){try{const agency=cpAgency.value,min=cpMinLots.value||0,d=await apiJson(`/carpark?min_lots=${min}${agency?`&agency=${agency}`:""}`),m=initMap("carpark","cp-map");cpMarkers.forEach(x=>m.removeLayer(x));cpMarkers=[];renderCards("cp-result",`${d.count} carparks | ${d.full_count} full`,d.carparks.slice(0,100).map(cp=>{if(cp.latitude&&cp.longitude){const mk=L.marker([cp.latitude,cp.longitude],{icon:markerIcon("#16875f",12)}).bindPopup(`<b>${cp.development||cp.carpark_id}</b><br>${cp.available_lots} lots<br>${cp.agency}`).addTo(m);cpMarkers.push(mk)}return `<div class="item-card"><div class="card-row"><span class="card-title">${cp.development||cp.carpark_id}</span><span class="badge badge-free">${cp.available_lots} lots</span></div><div class="card-meta">${cp.area||""} | ${cp.agency} | ${cp.status}</div></div>`}))}catch(e){cpResult.className="error-box";cpResult.textContent=e.message}}
    function initEV(){initMap("ev","ev-map");if(!evMarkers.length)loadEV()}function useMyLocation(){navigator.geolocation?.getCurrentPosition(p=>{evLat.value=p.coords.latitude.toFixed(5);evLng.value=p.coords.longitude.toFixed(5);loadEV()})}
    async function loadEV(){try{const d=await apiJson(`/ev/stations?lat=${evLat.value}&lng=${evLng.value}&radius_km=${evRadius.value}`),m=initMap("ev","ev-map");evMarkers.forEach(x=>m.removeLayer(x));evMarkers=[];renderCards("ev-result",`${d.count} stations within ${evRadius.value} km`,d.stations.map(s=>{if(s.latitude&&s.longitude){const mk=L.marker([s.latitude,s.longitude],{icon:markerIcon("#6750a4",12)}).bindPopup(`<b>${s.name||"EV Station"}</b><br>${s.address||""}`).addTo(m);evMarkers.push(mk)}return `<div class="item-card"><div class="card-row"><span class="card-title">${s.name||"EV Station"}</span><span class="badge badge-medium">${s.available??"?"}/${s.total_points??"?"}</span></div><div class="card-meta">${s.address||""} ${s.distance_km?`| ${s.distance_km} km`:""}</div></div>`}))}catch(e){evResult.className="error-box";evResult.textContent=e.message}}
    function initTaxi(){initMap("taxi","taxi-map");loadTaxi()}async function loadTaxi(){try{const d=await apiJson("/taxi/positions"),m=initMap("taxi","taxi-map");taxiCount.textContent=d.total_nearby;taxiUpdate.textContent=d.updated_at||new Date().toLocaleTimeString("vi-VN");taxiMarkers.forEach(x=>m.removeLayer(x));taxiMarkers=[];d.grid_cells.forEach(c=>{const size=Math.min(28,8+c.taxi_count*2),mk=L.marker([c.lat,c.lng],{icon:markerIcon("#b56a00",size)}).bindPopup(`<b>${c.taxi_count}</b> available taxis`).addTo(m);taxiMarkers.push(mk)})}catch(e){taxiUpdate.textContent=e.message}}
    document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>activateTab(b.dataset.tab)));window.addEventListener("load",()=>{checkHealth();initBus();setInterval(checkHealth,30000);setInterval(()=>{if(maps.taxi)loadTaxi()},60000)});
  </script>
</body>
</html>
